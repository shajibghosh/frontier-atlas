name: Validate data and website
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and regenerate outputs
        run: |
          python scripts/export_catalog.py
          python scripts/build.py
          python scripts/validate.py
          python scripts/prepublish_audit.py
          python -m unittest discover -s tests -v
          git diff --exit-code -- data/problems.csv data/references.csv docs/RESEARCH_CATALOG.md docs/index.html FrontierAtlas_Interactive.html
